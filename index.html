<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUADCUBE Consultants & Constructions</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #111827;
            --primary-light: #1f2937;
            --accent: #d97706;
            --accent-hover: #b45309;
            --bg-light: #f9fafb;
            --bg-white: #ffffff;
            --text-dark: #1f2937;
            --text-muted: #4b5563;
            --border-color: #e5e7eb;
            --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Outfit', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .brand-font {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
        }

        /* Header & Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo-img {
            height: 48px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 1.35rem;
            letter-spacing: 1px;
            color: var(--primary);
            line-height: 1.1;
        }

        .logo-subtitle {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 600;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
            position: relative;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent);
            transition: var(--transition);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .btn-header {
            background-color: var(--primary);
            color: var(--bg-white) !important;
            padding: 0.6rem 1.25rem;
            border-radius: 6px;
            font-weight: 500 !important;
        }

        .btn-header:hover {
            background-color: var(--accent);
        }

        .btn-header::after {
            display: none !important;
        }

        .hamburger {
            display: none;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--primary);
        }

        /* Hero Section */
        .hero {
            padding: 9rem 2rem 5rem 2rem;
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 4rem;
            align-items: center;
            min-height: 90vh;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            line-height: 1.15;
            color: var(--primary);
            margin-bottom: 1.5rem;
            letter-spacing: -0.5px;
        }

        .hero-content h1 span {
            color: var(--accent);
        }

        .hero-content p {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            max-width: 540px;
        }

        .hero-stats {
            display: flex;
            gap: 3rem;
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        .stat-item h3 {
            font-size: 2.25rem;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 0.25rem;
        }

        .stat-item p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0;
        }

        /* Hero Callback Form */
        .hero-form-card {
            background: var(--bg-white);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .hero-form-card h2 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .hero-form-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
            background-color: var(--bg-light);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            background-color: var(--bg-white);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234b5563' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--accent);
            color: var(--bg-white);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        /* Section Styling */
        section {
            padding: 5rem 2rem;
        }

        .section-header {
            text-align: center;
            max-width: 650px;
            margin: 0 auto 3.5rem auto;
        }

        .section-subtitle {
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.5rem;
            display: block;
        }

        .section-title {
            font-size: 2.25rem;
            color: var(--primary);
        }

        /* Services Grid */
        .services-bg {
            background-color: var(--bg-white);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .services-grid {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .service-card {
            background: var(--bg-light);
            padding: 2.25rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-shadow);
            border-color: rgba(217, 119, 6, 0.3);
        }

        .service-icon {
            width: 48px;
            height: 48px;
            background: rgba(217, 119, 6, 0.1);
            color: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1.25rem;
        }

        .service-card h3 {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 0.75rem;
        }

        .service-card p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* Projects Section */
        .projects-grid {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background: var(--bg-white);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            transition: var(--transition);
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .project-img-wrapper {
            position: relative;
            height: 240px;
            overflow: hidden;
            background-color: var(--bg-light);
        }

        .project-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .project-card:hover .project-img {
            transform: scale(1.05);
        }

        .project-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(17, 24, 39, 0.85);
            color: var(--bg-white);
            padding: 0.3rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        .project-info {
            padding: 1.5rem;
        }

        .project-info h3 {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 0.3rem;
        }

        .project-location {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .project-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* About Section */
        .about-bg {
            background: var(--bg-white);
            border-top: 1px solid var(--border-color);
        }

        .about-container {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-content h2 {
            font-size: 2.25rem;
            color: var(--primary);
            margin-bottom: 1.25rem;
        }

        .about-content p {
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            font-size: 1rem;
        }

        .about-features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .feature-item span {
            color: var(--accent);
        }

        .about-image {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .about-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Footer */
        footer {
            background-color: var(--primary);
            color: #9ca3af;
            padding: 4rem 2rem 2rem 2rem;
        }

        .footer-container {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;
            gap: 3rem;
            margin-bottom: 3rem;
        }

        .footer-col h3 {
            color: var(--bg-white);
            font-size: 1.2rem;
            margin-bottom: 1.25rem;
        }

        .footer-col p {
            font-size: 0.9
